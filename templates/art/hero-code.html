<div class="title">
  <div class="eyebrow">{{label}}</div>
  <h1>{{title}}</h1>
</div>
<div class="row">
  <div class="card right">
    <div class="head">{{inputLabel}}</div>
    <pre class="terminal">{{codeInput}}</pre>
  </div>
  <div class="arrow">→</div>
  <div class="card right">
    <div class="head">{{resultLabel}}</div>
    <pre class="terminal">{{output}}</pre>
  </div>
</div>
<p class="caption">{{subtitle}}</p>
