<div class="row">
  <div class="card left">
    <div class="head"><span>{{promptLabel}}</span></div>
    <pre class="input-copy">{{prompt}}</pre>
  </div>
  <div class="arrow">→</div>
  <div class="card right">
    <div class="head"><span>{{resultLabel}}</span><span>{{scoreLabel}}</span></div>
    <pre class="{{outputClass}} result-copy">{{output}}</pre>
  </div>
</div>
